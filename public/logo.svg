<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="compassGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7C3AED;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#C4B5FD;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="pointGradient" x1="0%" y1="0%" x2="50%" y2="50%">
      <stop offset="0%" style="stop-color:#6D28D9;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#C4B5FD;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Compass Rose Outer Ring -->
  <circle cx="256" cy="256" r="200" fill="#6D28D9" />
  
  <!-- Compass Rose Inner Circle -->
  <circle cx="256" cy="256" r="180" fill="#7C3AED" />
  
  <!-- Cardinal Points (N, E, S, W) -->
  <!-- North -->
  <path d="M 256 56 L 280 180 L 256 200 L 232 180 Z" fill="url(#pointGradient)" />
  <!-- East -->
  <path d="M 456 256 L 332 280 L 312 256 L 332 232 Z" fill="url(#pointGradient)" />
  <!-- South -->
  <path d="M 256 456 L 232 332 L 256 312 L 280 332 Z" fill="url(#pointGradient)" />
  <!-- West -->
  <path d="M 56 256 L 180 232 L 200 256 L 180 280 Z" fill="url(#pointGradient)" />
  
  <!-- Intercardinal Points (NE, SE, SW, NW) -->
  <!-- Northeast -->
  <path d="M 380 132 L 320 200 L 300 180 L 360 112 Z" fill="url(#pointGradient)" />
  <!-- Southeast -->
  <path d="M 380 380 L 300 312 L 320 332 L 360 400 Z" fill="url(#pointGradient)" />
  <!-- Southwest -->
  <path d="M 132 380 L 200 312 L 180 332 L 112 360 Z" fill="url(#pointGradient)" />
  <!-- Northwest -->
  <path d="M 132 132 L 180 200 L 200 180 L 112 112 Z" fill="url(#pointGradient)" />
  
  <!-- Center Circle -->
  <circle cx="256" cy="256" r="60" fill="#6D28D9" />
  
  <!-- Paper Airplane Trail (curved path) -->
  <path d="M 320 200 Q 360 160 400 120" stroke="#6D28D9" stroke-width="12" fill="none" stroke-linecap="round" opacity="0.6" />
  
  <!-- Paper Airplane -->
  <g transform="translate(400, 120) rotate(45)">
    <path d="M 0 -20 L 40 0 L 0 20 Z" fill="#6D28D9" />
    <path d="M 0 -15 L 30 0 L 0 15 Z" fill="#7C3AED" />
  </g>
</svg>
